<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Wolvesville Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body { margin: 0; background: #0d0b14; }
      :root[data-theme='hogwarts'] body { background: #140f09; }
    </style>
    <script>
      // Aplica tema/casa salvos antes da 1ª pintura, pra não piscar o tema padrão.
      try {
        var r = document.documentElement
        r.dataset.theme = localStorage.getItem('wvm.theme') === 'hogwarts' ? 'hogwarts' : 'default'
        r.dataset.house = localStorage.getItem('wvm.house') || 'gryffindor'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
